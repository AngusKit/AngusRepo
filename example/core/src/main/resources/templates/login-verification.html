<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录验证码</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 50%, #e0e7ff 100%);
      padding: 20px;
      line-height: 1.6;
    }

    .email-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(37, 99, 235, 0.15);
      overflow: hidden;
    }

    .email-header {
      background: linear-gradient(135deg, #2563eb 0%, #3b82f6 50%, #60a5fa 100%);
      padding: 40px 30px;
      text-align: center;
      color: #ffffff;
      position: relative;
      overflow: hidden;
    }

    .email-header::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.1);
        opacity: 0.8;
      }
    }

    .email-header h1 {
      position: relative;
      z-index: 1;
    }

    .email-header p {
      position: relative;
      z-index: 1;
    }

    .email-header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .email-header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .email-body {
      padding: 40px 30px;
    }

    .greeting {
      font-size: 18px;
      color: #333333;
      margin-bottom: 20px;
    }

    .message {
      color: #666666;
      font-size: 15px;
      margin-bottom: 30px;
    }

    .code-container {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      border: 2px dashed #3b82f6;
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      margin: 30px 0;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
    }

    .verification-code {
      font-size: 36px;
      font-weight: bold;
      color: #2563eb;
      letter-spacing: 8px;
      font-family: 'Courier New', monospace;
      text-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
    }

    .expiry-notice {
      background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
      border-left: 5px solid #2563eb;
      padding: 18px 20px;
      margin: 20px 0;
      color: #1e40af;
      font-size: 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.1);
      font-weight: 500;
    }

    .expiry-notice strong {
      color: #1e3a8a;
      font-weight: 700;
    }

    .security-tips {
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
      padding: 20px;
      border-radius: 12px;
      margin-top: 30px;
      border: 1px solid #bfdbfe;
    }

    .security-tips h3 {
      color: #1e40af;
      font-size: 16px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .security-tips ul {
      color: #475569;
      font-size: 14px;
      padding-left: 20px;
    }

    .security-tips li {
      margin-bottom: 8px;
    }

    .email-footer {
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      padding: 30px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
      border-top: 1px solid #e2e8f0;
    }

    .email-footer a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .email-footer a:hover {
      color: #1e40af;
      text-decoration: underline;
    }
  </style>
</head>
<body>
<div class="email-container">
  <div class="email-header">
    <h1>🔐 登录验证</h1>
    <p>保护您的账户安全</p>
  </div>

  <div class="email-body">
    <div class="greeting">
      您好，尊敬的用户！
    </div>

    <div class="message">
      我们收到了您的登录请求。为了保护您的账户安全，请使用以下验证码完成登录：
    </div>

    <div class="code-container">
      <div class="verification-code">{verificationCode}</div>
    </div>

    <div class="expiry-notice">
      ⏰ <strong>重要提示：</strong>此验证码将在 <strong>{expiryMinutes}分钟</strong> 后失效，请尽快使用。
    </div>

    <div class="security-tips">
      <h3>🛡️ 安全提示</h3>
      <ul>
        <li>请勿将验证码透露给任何人，包括客服人员</li>
        <li>如果这不是您本人的操作，请立即修改密码</li>
        <li>建议启用双因素认证以增强账户安全</li>
      </ul>
    </div>
  </div>

  <div class="email-footer">
    <p>此邮件由系统自动发送，请勿直接回复</p>
    <p>有疑问？访问 <a href="https://www.xcan.cloud">帮助中心</a> 或联系 <a
        href="mailto:echnical_support@xcan.cloud">客服支持</a></p>
    <p>© 2026 AngusGM. All rights reserved.</p>
  </div>
</div>
</body>
</html>
